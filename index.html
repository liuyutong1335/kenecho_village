<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kenecho Village ─ 健康と会話で育てるピクセルペット</title>
  <meta name="description" content="研修用ローカルWebアプリ。健康記録と会話練習でペットを育てるkenecho Village。" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page">
  <a class="skip-link" href="#app-root">メインコンテンツへ</a>

  <!-- トップバー（木製看板風） -->
  <header class="topbar" role="banner">
    <div class="topbar-inner">
      <button type="button" class="topbar-logo" data-nav="home" aria-label="ホームへ戻る">
        <span class="topbar-logo-mark" aria-hidden="true"></span>
        <span class="topbar-logo-text">kenecho Village</span>
      </button>
      <nav class="topbar-nav" aria-label="主要メニュー">
        <button type="button" data-nav="record">記録</button>
        <button type="button" data-nav="pet">ペット</button>
        <button type="button" data-nav="quest">会話クエスト</button>
        <button type="button" data-nav="notebook">交流ノート</button>
        <button type="button" data-nav="memories">思い出</button>
        <button type="button" data-nav="encyclopedia">図鑑</button>
        <button type="button" data-nav="settings">設定</button>
      </nav>
      <span class="topbar-badge" aria-label="研修用・本番利用不可">研修用・本番利用不可</span>
    </div>
  </header>

  <!-- メイン表示領域 -->
  <main id="app-root" class="app-root" tabindex="-1"></main>

  <!-- モーダル・通知のルート -->
  <div id="modal-root" class="modal-root"></div>

  <footer class="page-footer">
    <p>kenecho Village ─ 研修用・本番利用不可 ／ 本作品は医療・栄養・心理・人格を診断するものではありません</p>
  </footer>

  <!-- script は依存順で読み込む（ES Modules は file:// で動かないため不使用） -->
  <script src="js/util.js"></script>
  <script src="js/config.js"></script>

  <!-- データ層 -->
  <script src="js/data/relationship-rules.js"></script>
  <script src="js/data/foods.js"></script>
  <script src="js/data/exercises.js"></script>
  <script src="js/data/pets.js"></script>
  <script src="js/data/pet-coach-speech.js"></script>
  <script src="js/data/npc-data.js"></script>
  <script src="js/data/conversation-scenes.js"></script>
  <script src="js/data/animation-manifest.js"></script>
  <script src="js/data/pixel-art/pets.js"></script>

  <!-- ロジック層 -->
  <script src="js/db.js"></script>
  <script src="js/health.js"></script>
  <script src="js/pet-game.js"></script>
  <script src="js/relationship.js"></script>
  <script src="js/dialogue-engine.js"></script>
  <script src="js/conversation-game.js"></script>

  <!-- 表現層 -->
  <script src="js/sprite.js"></script>
  <script src="js/animation.js"></script>
  <script src="js/ui.js"></script>
  <!-- エントリポイント（最後） -->
  <script src="js/app.js"></script>
</body>
</html>
